<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f5f6f4">
<meta name="color-scheme" content="light">
<title>CRM | F&A Sales Consulting</title>
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" href="assets/icon-192.png" type="image/png" sizes="192x192">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="crm">
<a class="skip" href="#view">Zum Inhalt springen</a>

<!-- Anmelden / Passwort festlegen -->
<main class="auth" id="login" hidden>
  <a class="mark" href="index.html">F&amp;A <span>Sales Consulting</span></a>
  <div class="card auth__card">
    <h1>Anmelden</h1>
    <p class="soft">CRM für das Team von F&amp;A.</p>
    <form id="loginform" class="stack" novalidate>
      <div class="field"><label for="l-email">E-Mail</label><input id="l-email" type="email" autocomplete="username" required></div>
      <div class="field"><label for="l-pass">Passwort</label><input id="l-pass" type="password" autocomplete="current-password" required></div>
      <p class="msg bad" id="loginerr" role="alert" hidden></p>
      <button class="btn btn--wide" type="submit">Anmelden</button>
      <button class="link" type="button" id="forgot">Passwort vergessen?</button>
    </form>
  </div>
</main>

<main class="auth" id="setpw" hidden>
  <a class="mark" href="index.html">F&amp;A <span>Sales Consulting</span></a>
  <div class="card auth__card">
    <h1>Passwort festlegen</h1>
    <p class="soft">Willkommen! Lege ein Passwort für dein Konto fest.</p>
    <form id="setpwform" class="stack" novalidate>
      <div class="field"><label for="p-new">Neues Passwort <small>mindestens 10 Zeichen</small></label><input id="p-new" type="password" autocomplete="new-password" required minlength="10"></div>
      <p class="msg bad" id="setpwerr" role="alert" hidden></p>
      <button class="btn btn--wide" type="submit">Speichern und weiter</button>
    </form>
  </div>
</main>

<!-- CRM -->
<div class="app" id="app" hidden>
  <aside class="side" id="side" aria-label="Menü">
    <div class="side__top">
      <a class="mark" href="#start">F&amp;A <span>CRM</span></a>
      <button class="side__close" type="button" id="menu-close" aria-label="Menü schließen">Schließen</button>
    </div>
    <nav id="nav" class="side__nav"></nav>
    <div class="side__user">
      <span id="who"></span>
      <button class="link" type="button" id="logout">Abmelden</button>
    </div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <header class="top">
    <a class="mark" href="#start">F&amp;A <span>CRM</span></a>
  </header>

  <main class="view" id="view" tabindex="-1"></main>

  <nav class="tabbar" id="tabbar" aria-label="Schnellzugriff"></nav>
</div>

<div class="toast" id="flash" role="status" aria-live="polite"></div>
<noscript><p class="card">Diese Seite braucht JavaScript.</p></noscript>

<script src="js/config.js"></script>
<script src="js/admin/core.js"></script>
<script src="js/admin/leads.js"></script>
<script src="js/admin/team.js"></script>
<script src="js/admin/money.js"></script>
<script src="js/admin/ads.js"></script>
<script src="js/admin/groups.js"></script>
<script src="js/admin/settings.js"></script>
</body>
</html>
